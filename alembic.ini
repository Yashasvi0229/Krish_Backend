# ============================================================================
# Alembic configuration — https://alembic.sqlalchemy.org/
# The actual DB URL is read from env vars in alembic/env.py, so we leave
# `sqlalchemy.url` blank here.
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Timezone-aware migration timestamps (matches our DB TIMESTAMPTZ columns).
timezone = UTC

# ---- Logging ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
