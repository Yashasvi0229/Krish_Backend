# ============================================================================
# Render Blueprint — https://render.com/docs/blueprint-spec
# Push this file to your Git repo, then in Render:
#   New → Blueprint → select repo → Apply
# Render will provision all services below in one shot.
# ============================================================================

databases:
  - name: gnc-invoice-db
    databaseName: gnc_invoice
    user: gnc
    plan: free                    # free tier: 1 GB, 90-day expiry — upgrade later
    postgresMajorVersion: "16"
    region: singapore             # closest to India; change if needed

services:
  # ---- Redis (Key-Value store) ----
  - type: keyvalue
    name: gnc-invoice-redis
    plan: free                    # free tier: 25 MB — enough for Celery + cache
    region: singapore
    ipAllowList: []               # [] = private, only reachable from Render services
    maxmemoryPolicy: allkeys-lru

  # ---- Backend web service (FastAPI) ----
  - type: web
    name: gnc-invoice-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                    # free tier sleeps after 15 min idle — upgrade for prod
    region: singapore
    healthCheckPath: /health
    autoDeploy: true              # auto-redeploy on git push
    envVars:
      # ---- App ----
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # ---- Server (Render injects PORT automatically; we bind to it) ----
      - key: FRONTEND_URL
        sync: false               # set manually in Render dashboard after frontend deploy
      - key: ALLOWED_ORIGINS
        sync: false               # comma-separated list of frontend URLs

      # ---- Database (auto-populated from the database above) ----
      - key: DATABASE_URL
        fromDatabase:
          name: gnc-invoice-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: gnc-invoice-db
          property: connectionString
      # NOTE: Render's connectionString uses `postgresql://`. Our app expects
      # `postgresql+asyncpg://` and Alembic expects `postgresql+psycopg2://`.
      # We handle this in app/config.py by rewriting the prefix at startup
      # (added in the next step).

      # ---- Redis (auto-populated from the keyvalue service above) ----
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gnc-invoice-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: gnc-invoice-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: gnc-invoice-redis
          property: connectionString
      # Free tier: run Celery tasks inline in the web process (no worker
      # service needed). Flip to "false" when we add a paid worker.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"

      # ---- Secrets (generated by Render, never visible in the dashboard) ----
      - key: SECRET_KEY
        generateValue: true
      - key: KEY_ENCRYPTION_KEY
        sync: false               # generate manually: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

      # ---- Admin credentials (Phase 1 login — Step 3) ----
      - key: ADMIN_EMAIL
        sync: false               # e.g. admin@gnc.local
      - key: ADMIN_PASSWORD
        sync: false               # pick something strong — this is the only login
      - key: ADMIN_DISPLAY_NAME
        value: Administrator

      # ---- Google OAuth (fill in Render dashboard) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false               # https://gnc-invoice-backend.onrender.com/api/auth/google/callback

      # ---- AI keys (fill in Render dashboard, Step 5) ----
      - key: CLAUDE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---- Celery worker (background jobs) — enable in Step 4 ----
  # Uncomment when we add Celery tasks. On Render's free tier a worker
  # service is a paid resource; we can also run Celery inside the web
  # service for now (not ideal, but free).
  #
  # - type: worker
  #   name: gnc-invoice-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: celery -A app.celery_app worker --loglevel=info --concurrency=2
  #   plan: starter
  #   region: singapore
  #   envVars:
  #     - fromGroup: gnc-invoice-backend-env    # reuse the web service's env
